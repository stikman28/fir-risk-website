baseURL = 'https://firrisk.ai/'
languageCode = 'en-us'
title = 'FIR Risk Advisory | Risk Intelligence. Engineered.'
buildFuture = true

# AI discoverability: llms.txt (index) + llms-full.txt (complete content) at site root
[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.llmsfull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true

# Hinode theme via Hugo modules
[module]
  [[module.imports]]
    path = "github.com/gethinode/hinode"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"

[params]
  description = "AI-powered risk intelligence for cyber, fraud, and compliance teams"
  tagline = "Risk Intelligence. Engineered."
  brand = "FIR Risk Advisory"
  author = "Bruce Bird"
  email = "hello@firrisk.ai"
  location = "Berthoud, Colorado"

  [params.navigation]
    brand = "FIR Risk Advisory"
    logo = "img/logo.png"
    logo-height = 80

  [params.favicon]
    logo = "/img/favicon.png"

  # Hinode theme settings
  [params.main]
    separator = "-"
    description = "AI solutions, data platforms, and risk intelligence—grounded in trusted sources, not internet noise."

  [params.main.colorMode]
    enabled = true
    default = "dark"

  [params.style]
    primary = "#00e5a9"
    secondary = "#16393F"
    themeOpacity = "10"

  # SEO: Organization schema (replaces Hinode defaults)
  [params.schema]
    type = "Organization"
    name = "FIR Risk Advisory"
    locale = "en-US"
    github = "https://github.com/stikman28"
    linkedin = "https://www.linkedin.com/in/brucecbird/"
    [params.schema.author]
      name = "Bruce Bird"
      linkedin = "https://www.linkedin.com/in/brucecbird/"
      github = "https://github.com/stikman28"
    [params.schema.logo]
      url = "img/logo.png"
      width = 546
      height = 334
    [params.schema.image]
      url = "img/logo.png"
      width = 546
      height = 334

  # SEO: Open Graph fallback image
  [params.opengraph]
    images = ["img/logo.png"]
    locale = "en_US"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Platform"
    url = "/platform/"
    weight = 2
  [[menu.main]]
    name = "Services"
    url = "/solutions/"
    weight = 3
  [[menu.main]]
    name = "How We Work"
    url = "/how-we-work/"
    weight = 4
  [[menu.main]]
    name = "Intelligence"
    identifier = "intelligence"
    weight = 5
  [[menu.main]]
    name = "INTEL Briefs"
    url = "/intel/"
    parent = "intelligence"
    weight = 1
  [[menu.main]]
    name = "FIR Risk Tuesday"
    url = "/tuesday/"
    parent = "intelligence"
    weight = 2
  [[menu.main]]
    name = "Reports"
    url = "/reports/"
    parent = "intelligence"
    weight = 3
  [[menu.main]]
    name = "Resources"
    url = "/resources/"
    parent = "intelligence"
    weight = 4
  [[menu.main]]
    name = "Partners"
    url = "/partners/"
    weight = 6
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 7
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 8

  [[menu.footer]]
    name = "Privacy Policy"
    url = "/privacy/"
    weight = 1
  [[menu.footer]]
    name = "Resources"
    url = "/resources/"
    weight = 2
  [[menu.footer]]
    name = "Contact"
    url = "/contact/"
    weight = 3

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "llms", "llmsfull"]
  section = ["HTML", "RSS"]

# RSS feeds on /resources/ are fetched at build time (resources.GetRemote). Expire the
# fetch cache so the daily scheduled rebuild pulls fresh items even if the build cache persists.
[caches]
  [caches.getresource]
    dir = ':cacheDir/:project'
    maxAge = '6h'

# GA4 is loaded directly in layouts/_partials/head/custom.html. Hinode's mod-google-analytics
# bundle (core.bundle-analytics.js) only renders a comment here and shipped with a mismatched
# SRI hash, so keep that module out of the core bundle.
[params.modules.GoogleAnalytics]
  integration = "optional"

# Related content for the end-of-article panel (layouts/_partials/article/end-panel.html):
# match on shared tags, prefer recent, include newer pieces too.
[related]
  includeNewer = true
  threshold = 30
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10
