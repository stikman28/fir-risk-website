<!-- Article schema for FIR Risk Tuesday + INTEL pages (SEO + AI answer engines) -->
{{ if and .IsPage (in (slice "tuesday" "intel") .Section) }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | jsonify }},
  "description": {{ .Description | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02" | jsonify }},
  "dateModified": {{ .Lastmod.Format "2006-01-02" | jsonify }},
  {{ with .Params.thumbnail }}"image": {{ absURL . | jsonify }},{{ end }}
  "author": {
    "@type": "Person",
    "name": "Bruce Bird",
    "url": "https://www.linkedin.com/in/bruce-bird-4544a114/"
  },
  "publisher": {
    "@type": "Organization",
    "name": "FIR Risk Advisory",
    "url": "https://firrisk.ai/",
    "logo": { "@type": "ImageObject", "url": "https://firrisk.ai/img/logo.png" }
  },
  "mainEntityOfPage": {{ .Permalink | jsonify }},
  "isAccessibleForFree": true
}
</script>
{{ end }}
